[package]
name = "ac1-assets"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# Asheron's Call 1 creatures in the AC2 world (the `ac1-monsters` test branch): the AC1 DATs
# mounted beside the AC2 ones through the same `ac2-dat` B-tree reader Vitaeum mounts them with,
# the AC1 records a creature draws decoded, and the result handed to `ac2-render` as an
# `ObjectModel` posed by its idle animation.
[dependencies]
ac2-core = { path = "../ac2-core" }
ac2-dat = { path = "../ac2-dat" }
ac2-math = { path = "../ac2-math" }
ac2-anim = { path = "../ac2-anim" }
ac2-assets = { path = "../ac2-assets" }
ac2-physics = { path = "../ac2-physics" }
ac2-render = { path = "../ac2-render" }
