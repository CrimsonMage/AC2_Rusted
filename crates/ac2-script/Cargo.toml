[package]
name = "ac2-script"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

# The WSL interpreter: compiled script library (WLib), saved script states (WState), the VM and
# its native glue. Plain data in, plain data out; DAT reads go through ac2-db on worker threads.
[dependencies]
ac2-core = { path = "../ac2-core" }
ac2-dat = { path = "../ac2-dat" }
ac2-db = { path = "../ac2-db" }
ac2-net = { path = "../ac2-net" }
ac2-weenie = { path = "../ac2-weenie" }
log = "0.4"

[dev-dependencies]
ac2-dat = { path = "../ac2-dat", features = ["test-support"] }
