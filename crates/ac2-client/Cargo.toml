[package]
name = "ac2-client"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

# The client program's core: the only crate that joins the online session (ac2-weenie) and the
# body simulation (ac2-physics). The render crate is headless (it builds the scene and registers
# the render preferences); only the GPU crate (ac2-gpu) and the window are behind the `window`
# feature (on by default), which adds the drawn view and the `ac2` window program.
[lints]
workspace = true

[features]
default = ["window"]
window = ["dep:ac2-gpu", "dep:winit", "dep:wgpu", "ac2-audio/output"]
# Element lookups for the HUD drag tests (`view::probe`); never in the shipped client.
test-support = []
# Opt-in CPU scopes (`profile_scope!`) and a puffin server on 127.0.0.1:8585 for the `ac2` program;
# never in the shipped default build.
profiling = ["dep:puffin", "dep:puffin_http"]

[[bin]]
name = "ac2"
path = "src/bin/ac2/main.rs"
required-features = ["window"]

[dependencies]
ac2-anim = { path = "../ac2-anim" }
ac2-assets = { path = "../ac2-assets" }
ac2-audio = { path = "../ac2-audio", default-features = false }
ac2-core = { path = "../ac2-core" }
ac2-dat = { path = "../ac2-dat" }
ac2-db = { path = "../ac2-db" }
ac2-math = { path = "../ac2-math" }
ac2-net = { path = "../ac2-net" }
ac2-prefs = { path = "../ac2-prefs" }
ac2-physics = { path = "../ac2-physics" }
ac2-smartbox = { path = "../ac2-smartbox" }
ac2-script = { path = "../ac2-script" }
ac2-weenie = { path = "../ac2-weenie" }
ac2-world = { path = "../ac2-world" }
ac2-ui = { path = "../ac2-ui" }
ac2-render = { path = "../ac2-render" }
ac2-gpu = { path = "../ac2-gpu", optional = true }
winit = { version = "0.30", optional = true }
wgpu = { version = "30.0.1", default-features = false, optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
arboard = "3.7"
# `puffin` 0.20 with its matching `puffin_http` 0.17 (which depends on puffin 0.20).
puffin = { version = "0.20", optional = true }
puffin_http = { version = "0.17", optional = true }

[dev-dependencies]
ac2-client = { path = ".", features = ["test-support"] }
ac2-dat = { path = "../ac2-dat", features = ["test-support"] }
legions-server-double = { path = "../../tools/legions-server-double" }
png = "0.18"
