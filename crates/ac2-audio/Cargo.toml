[package]
name = "ac2-audio"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

# The sound data (decoded on a loader thread), retail's SoundManager on the frame thread, and a
# software mixer. Only the `output` feature (on by default) adds the speaker backend (cpal:
# WASAPI on Windows, ALSA on Linux, CoreAudio on macOS); without it the manager drives a null or
# recording sink.
[lints]
workspace = true

[features]
default = ["output"]
output = ["dep:cpal"]

[dependencies]
ac2-core = { path = "../ac2-core" }
ac2-dat = { path = "../ac2-dat" }
ac2-db = { path = "../ac2-db" }
ac2-prefs = { path = "../ac2-prefs" }
log = "0.4"
cpal = { version = "0.17", optional = true }
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }

[dev-dependencies]
ac2-dat = { path = "../ac2-dat", features = ["test-support"] }
