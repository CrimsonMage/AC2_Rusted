[package]
name = "ac2-smartbox"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# `SmartBox` and cell residency (INDEX pack 08 `smartbox`): the player camera, the landblocks
# resident around the player and their loader threads. Plain data in and out; no session, no
# network, so the offline world viewer shares it with the client.
[dependencies]
ac2-anim = { path = "../ac2-anim" }
ac2-assets = { path = "../ac2-assets" }
ac2-core = { path = "../ac2-core" }
ac2-dat = { path = "../ac2-dat" }
ac2-db = { path = "../ac2-db" }
ac2-net = { path = "../ac2-net" }
ac2-physics = { path = "../ac2-physics" }
ac2-prefs = { path = "../ac2-prefs" }
ac2-world = { path = "../ac2-world" }

[dev-dependencies]
ac2-dat = { path = "../ac2-dat", features = ["test-support"] }
