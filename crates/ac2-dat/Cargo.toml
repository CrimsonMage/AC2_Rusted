[package]
name = "ac2-dat"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ac2-core = { path = "../ac2-core" }
encoding_rs = "0.8"
serde = { version = "1.0.228", features = ["derive"] }

[features]
# One shared `AC2_DAT_DIR` mount per test process; enabled from dev-dependencies only.
test-support = []

[dev-dependencies]
tempfile = "3.27.0"
