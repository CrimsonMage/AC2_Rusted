[package]
name = "ac2-guide"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# The quest guide: the AC2 Vault site mirror baked in at build time (`AC2VAULT_DIR`, the merged
# `ac2vault.ign.com` tree; empty when unset, and nothing from it is ever committed), its pages,
# quest facts, reward items and images, the map coordinates in them, and steering towards them.
[dependencies]
ac2-physics = { path = "../ac2-physics" }
# The site's pictures as pixels for the guide window (the formats the mirror holds).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp"] }
