[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false
license = "AGPL-3.0-only"

# Retail comparisons are written `!(a < b)` and `t < 0.0 || t > 1.0` on purpose: they differ from
# `a >= b` and `!(0.0..=1.0).contains(&t)` for NaN. Retail function signatures carry their many
# parameters and tuple types as they are.
[workspace.lints.clippy]
neg_cmp_op_on_partial_ord = "allow"
manual_range_contains = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

# Profiling builds (`cargo build --profile profiling --features profiling`): the release code with
# thin LTO, so a build is quicker, and line tables for the puffin scopes and perf samples.
[profile.profiling]
inherits = "release"
lto = "thin"
debug = "line-tables-only"
